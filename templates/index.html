<!DOCTYPE html>
<html>
<head>
    <title>Movie Recommendation System </title>
</head>

<body>
    <h1>Movie Recommendation System</h1>
    <form method="POST">
        <input
        type = "text"
        name = "movie"
        placeholder = "Enter Movie Name" required>
        <button type = "submit">
            Recommend
        </button>
        </form>
        {% if movie_name %}
         <h3>Recommendations For {{movie_name}}</h3>
         {% if recommendations %}
         <ul>
            {% for movie in recommendations %}
            <li>{{movie}}</li>
            {% endfor %}
            </ul>
            {% else %}
            <p>No recommendations found.</p>
            
        {% endif %}
            
    {% endif %}
</body>
</html>
